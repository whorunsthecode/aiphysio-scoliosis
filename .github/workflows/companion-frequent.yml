# Optional: every-2-hour Companion firing.
#
# Vercel Hobby caps crons at one fire/day. The Companion's spec cadence is
# every 2h during waking hours (8am–10pm). This workflow restores that
# cadence by hitting the same endpoint via GitHub Actions (unlimited free
# scheduled workflows). It's OFF by default to avoid noise; enable when
# you want the high-frequency cadence back.
#
# To enable:
#   1. GitHub repo → Settings → Secrets and variables → Actions → "New repository secret":
#        VERCEL_BASE_URL  → https://<your-project>.vercel.app   (no trailing slash)
#        CRON_SECRET      → same value you set in Vercel env
#   2. Uncomment the `schedule` block below.
#   3. Commit. The workflow appears under the Actions tab and runs every 2h.
#
# Note: GitHub Actions cron uses UTC. Schedule covers waking hours in HKT
# (UTC+8) → 0,2,4,6,8,10,12,14 UTC = 8am–10pm HKT.
#
# Right now: only `workflow_dispatch` (manual run from the Actions tab UI)
# is wired, and the curl is guarded so it explains the missing secret
# instead of failing silently.

name: Companion every 2h (waking hours)

on:
  # schedule:
  #   - cron: "0 0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch: {}

jobs:
  fire-companion:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/agents/companion
        env:
          BASE_URL: ${{ secrets.VERCEL_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::warning::VERCEL_BASE_URL or CRON_SECRET secret not set — skipping. See workflow header to enable."
            exit 0
          fi
          curl -sS -o response.json -w "HTTP %{http_code}\n" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/agents/companion"
          cat response.json
